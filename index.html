<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">better
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose offer type</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=trench-slab@500&f[]=general-sans@400,500&display=swap">
<style>
  :root{
    --bg: #060706;
    --panel: #0d0f0d;
    --panel-2: #101210;
    --line: rgba(255,255,255,0.06);
    --muted: rgba(255,255,255,0.08);
    --chip: #12140f;
    --green: #35e07a;
    --green-dim: #1c7a45;
    --arrow-bg: #16181a;

    /* sunset gradient palette for the card */
    --sunset-peach: #ffd9bf;
    --sunset-coral: #ff9fb8;
    --sunset-orchid: #c68af0;
    --sunset-violet: #8b6bf0;
    --sunset-blue: #4d63ff;

    /* ---- BACKGROUND IMAGE OPTION ----
       To use a custom image as the page background, set a URL here:
       --page-bg-image: url('https://example.com/your-image.jpg');
       Leave as none to keep the plain light background. */
    --page-bg-image: url('bgbg.png');
    --page-bg-color: #eef0f3;
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background-color: var(--page-bg-color);
    background-image: var(--page-bg-image), radial-gradient(ellipse 1200px 700px at 50% 0%, #ffffff, transparent 65%), linear-gradient(150deg, #f1f2f5 0%, #e2e4e9 55%, #d3d6dc 100%);
    background-size: cover, cover, cover;
    background-position: center;
    background-repeat: no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px;
    font-family: "General Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .card-wrap{
    position:relative;
    width: clamp(480px, 90vw, 720px);
    border-radius:28px;
    padding:1.5px; /* border thickness for the running light */
    isolation:isolate;
  }

  /* stacked-paper shadow layers behind the card, like the reference */
  .card-wrap .stack{
    position:absolute;
    inset:0;
    border-radius:30px;
    background: #f3f4f6;
    z-index:-1;
  }
  .card-wrap .stack.s1{
    transform: translate(10px, 14px) rotate(1.4deg);
    background: rgba(255,255,255,0.75);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,0.25);
  }
  .card-wrap .stack.s2{
    transform: translate(20px, 26px) rotate(2.6deg);
    background: rgba(255,255,255,0.55);
    box-shadow: 0 24px 50px -20px rgba(0,0,0,0.2);
  }

  @keyframes spin{
    to{ transform: rotate(360deg); }
  }

  .card{
    position:relative;
    z-index: 3;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.35), transparent 40%),
      linear-gradient(165deg, var(--sunset-peach) 0%, var(--sunset-coral) 26%, var(--sunset-orchid) 52%, var(--sunset-violet) 74%, var(--sunset-blue) 100%);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 26px;
    box-shadow:
      0 40px 70px -25px rgba(60,40,120,0.45),
      inset 0 1px 0 rgba(255,255,255,0.4);
    overflow:hidden;
  }

  .content{
    width:100%;
    padding: 34px 40px;
    display:grid;
    grid-template-columns: 1fr 1.2fr;
    gap: 36px;
    align-items:center;
  }
  .content-left{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  .content-right{
    display:flex;
    flex-direction:column;
  }
  @media (max-width: 620px){
    .content{
      grid-template-columns: 1fr;
    }
  }

  /* faint dot grid, softened for the gradient background */
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:26px;
    background-image: radial-gradient(rgba(255,255,255,0.18) 1px, transparent 1px);
    background-size: 16px 16px;
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 30%, black, transparent 75%);
            mask-image: radial-gradient(ellipse 60% 50% at 50% 30%, black, transparent 75%);
    pointer-events:none;
  }

  /* progress dashes */
  .progress{
    position:relative;
    display:flex;
    gap:6px;
    justify-content:center;
    margin-bottom: 34px;
  }
  .progress span{
    width: 26px;
    height: 4px;
    border-radius: 3px;
    background: rgba(255,255,255,0.85);
    box-shadow: 0 0 8px rgba(255,255,255,0.5);
  }

  /* folder / document icon */
  .icon-hero{
    position:relative;
    width: 88px;
    height: 88px;
    margin: 0 auto 22px;
  }
  .icon-hero .paper{
    position:absolute;
    left: 16px;
    top: 6px;
    width: 52px;
    height: 62px;
    background: linear-gradient(180deg,#fbfbfb,#e9e9e9);
    border-radius: 6px;
    transform: rotate(-4deg);
    box-shadow: 0 8px 16px rgba(0,0,0,0.35);
  }
  .icon-hero .paper::before{
    content:"";
    position:absolute;
    left:10px; right:10px; top:14px;
    height:6px;
    border-radius:3px;
    background: rgba(0,0,0,0.12);
  }
  .icon-hero .paper::after{
    content:"";
    position:absolute;
    left:10px; right:22px; top:26px;
    height:4px;
    border-radius:2px;
    background: rgba(0,0,0,0.08);
    box-shadow: 0 10px 0 rgba(0,0,0,0.08), 0 20px 0 rgba(0,0,0,0.08);
  }
  .icon-hero .folder{
    position:absolute;
    left: 8px;
    bottom: 8px;
    width: 72px;
    height: 40px;
    background: linear-gradient(180deg,#4a3f78,#2c2456);
    border-radius: 10px;
    box-shadow:
      0 10px 20px rgba(30,10,60,0.35),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .icon-hero .folder::before{
    content:"";
    position:absolute;
    left:14px; right:14px; top:-6px;
    height:12px;
    background: #362c60;
    border-radius: 6px 6px 0 0;
  }

  /* corner accent badge, like the sparkle circle in the reference */
  .corner-badge{
    position:absolute;
    top: -18px;
    left: 28px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9fd8ff, #4d63ff 60%, #2f3fc9 100%);
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 10px 24px rgba(40,60,200,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index: 5;
  }
  .corner-badge svg{
    width: 22px;
    height: 22px;
    fill: #ffffff;
  }

  /* placeholder text bars, restyled for the gradient background */
  .bar{
    border-radius: 6px;
    background: rgba(255,255,255,0.35);
  }
  .hero-title{
    margin: 0 auto 14px;
    text-align: center;
    font-family: "Trench Slab", "General Sans", serif;
    font-size: clamp(28px, 7vw, 40px);
    line-height: 1.15;
    font-weight: 500;
    letter-spacing: -0.5px;
    color: #ffffff;
    text-shadow: 0 4px 20px rgba(40,20,80,0.25);
  }
  .subtitle-bar{
    width: 78%;
    height: 12px;
    margin: 0 auto 6px;
  }
  .subtitle-bar.short{
    width: 50%;
    margin-bottom: 26px;
  }

  /* list rows */
  .rows{
    display:flex;
    flex-direction:column;
    gap: 14px;
    margin-bottom: 22px;
  }
  .row{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 8px 4px;
    border-radius: 14px;
    transition: background .2s ease;
  }
  .row:hover{
    background: rgba(255,255,255,0.12);
  }
  .row-icon{
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: 1px solid rgba(255,255,255,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size: 20px;
    backdrop-filter: blur(4px);
  }
  .row-text{
    flex: 1 1 auto;
    display:flex;
    flex-direction:column;
    gap: 4px;
    min-width: 0;
  }
  .row-fact{
    font-family: "General Sans", sans-serif;
    font-size: 13px;
    line-height: 1.4;
    color: #ffffff;
    font-weight: 600;
  }
  .row-fact-sub{
    font-family: "General Sans", sans-serif;
    font-size: 11px;
    line-height: 1.4;
    color: rgba(255,255,255,0.7);
  }
  .change-row{
    display:flex;
    justify-content:center;
    margin-top: 22px;
  }
  .change-btn{
    font-family: "General Sans", sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: #4d3fa8;
    background: rgba(255,255,255,0.92);
    border: 1px solid rgba(255,255,255,0.9);
    padding: 10px 22px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 8px 20px rgba(40,20,90,0.25);
  }
  .change-btn:hover{
    transform: translateY(-1px);
    box-shadow: 0 10px 26px rgba(40,20,90,0.32);
  }
  .change-btn:active{
    transform: translateY(0);
  }
  /* falling snow */
  .snow-layer{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 50;
  }
  .snowflake{
    position: absolute;
    top: -10px;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.85;
    filter: drop-shadow(0 0 2px rgba(255,255,255,0.6));
    animation-name: snow-fall, snow-sway;
    animation-timing-function: linear, ease-in-out;
    animation-iteration-count: infinite, infinite;
  }
  @keyframes snow-fall{
    from{ transform: translateY(-10px); }
    to{ transform: translateY(110vh); }
  }
  @keyframes snow-sway{
    0%, 100%{ margin-left: 0px; }
    50%{ margin-left: 24px; }
  }
</style>
</head>
<body>

<div class="snow-layer" id="snowLayer"></div>

<div class="card-wrap">
  <div class="stack s2"></div>
  <div class="stack s1"></div>
  <div class="corner-badge">
    <svg viewBox="0 0 24 24"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8L12 2z"/></svg>
  </div>
  <div class="card">
    <div class="content">

    <div class="content-left">

    <div class="progress">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="icon-hero">
      <div class="folder"></div>
      <div class="paper"></div>
    </div>

    <h1 class="hero-title">Hello, World!</h1>
    <div class="bar subtitle-bar"></div>
    <div class="bar subtitle-bar short"></div>

    </div>

    <div class="content-right">

    <div class="rows" id="factRows">

      <div class="row">
        <div class="row-icon" data-emoji></div>
        <div class="row-text">
          <div class="row-fact" data-fact></div>
          <div class="row-fact-sub" data-source></div>
        </div>
      </div>

      <div class="row">
        <div class="row-icon" data-emoji></div>
        <div class="row-text">
          <div class="row-fact" data-fact></div>
          <div class="row-fact-sub" data-source></div>
        </div>
      </div>

      <div class="row">
        <div class="row-icon" data-emoji></div>
        <div class="row-text">
          <div class="row-fact" data-fact></div>
          <div class="row-fact-sub" data-source></div>
        </div>
      </div>

    </div>

    <div class="change-row">
      <button class="change-btn" onclick="showNewFacts()">Change facts</button>
    </div>

    </div>

    </div>
  </div>
</div>

<script>
  const factPool = [
    { emoji: "🐙", fact: "Octopuses have three hearts and blue blood.", source: "Marine biology" },
    { emoji: "🍯", fact: "Honey never spoils if stored properly.", source: "Food science" },
    { emoji: "🌋", fact: "There are more possible chess games than atoms in the universe.", source: "Mathematics" },
    { emoji: "🦈", fact: "Sharks existed before trees appeared on Earth.", source: "Paleontology" },
    { emoji: "🌙", fact: "The Moon is slowly drifting away from Earth each year.", source: "Astronomy" },
    { emoji: "🐝", fact: "Bees can recognize individual human faces.", source: "Animal cognition" },
    { emoji: "🧠", fact: "The human brain uses about 20% of the body's energy.", source: "Neuroscience" },
    { emoji: "🦩", fact: "Flamingos are born gray, not pink.", source: "Zoology" },
    { emoji: "❄️", fact: "No two snowflakes have ever been proven identical.", source: "Physics" },
    { emoji: "🐢", fact: "Some tortoises can live longer than 150 years.", source: "Biology" },
    { emoji: "🌊", fact: "Over 80% of the ocean remains unmapped and unexplored.", source: "Oceanography" },
    { emoji: "🍎", fact: "Apples float in water because they're 25% air.", source: "Fun science" },
    { emoji: "🌌", fact: "A day on Venus is longer than its year.", source: "Astronomy" },
    { emoji: "🐜", fact: "Ants can carry objects many times their own body weight.", source: "Entomology" },
    { emoji: "🎻", fact: "Sound travels about four times faster in water than in air.", source: "Physics" },
  ];

  function pickThreeRandom(pool){
    const shuffled = [...pool].sort(() => Math.random() - 0.5);
    return shuffled.slice(0, 3);
  }

  function renderFacts(facts){
    const rows = document.querySelectorAll('#factRows .row');
    rows.forEach((row, i) => {
      const f = facts[i];
      row.querySelector('[data-emoji]').textContent = f.emoji;
      row.querySelector('[data-fact]').textContent = f.fact;
      row.querySelector('[data-source]').textContent = f.source;
    });
  }

  function showNewFacts(){
    renderFacts(pickThreeRandom(factPool));
  }

  renderFacts(pickThreeRandom(factPool));

  // falling snow
  (function createSnow(){
    const layer = document.getElementById('snowLayer');
    const count = 60;
    for(let i = 0; i < count; i++){
      const flake = document.createElement('div');
      flake.className = 'snowflake';
      const size = Math.random() * 4 + 2; // 2px - 6px
      const left = Math.random() * 100; // vw
      const fallDuration = Math.random() * 10 + 8; // 8s - 18s
      const swayDuration = Math.random() * 4 + 3; // 3s - 7s
      const delay = Math.random() * -20; // negative so they start mid-fall
      const opacity = Math.random() * 0.5 + 0.4;

      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.left = left + 'vw';
      flake.style.opacity = opacity;
      flake.style.animationDuration = fallDuration + 's, ' + swayDuration + 's';
      flake.style.animationDelay = delay + 's, ' + delay + 's';

      layer.appendChild(flake);
    }
  })();
</script>

</body>
</html>
