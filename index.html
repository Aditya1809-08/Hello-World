<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World — Light Leak Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #06051d;
        --surface: #0d0d2d;
        --surface-soft: #121235;
        --text: #f7f7ff;
        --muted: #9b9bb9;
        --accent: #9ca7ff;
        --accent-bright: #dfe2ff;
        --line: rgba(199, 205, 255, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--background);
        color: var(--text);
        font-family: "Inter", system-ui, sans-serif;
      }

      .page {
        min-height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 56px clamp(28px, 8vw, 112px) 42px;
        position: relative;
        isolation: isolate;
      }

      .page::before {
        content: "";
        position: absolute;
        width: min(440px, 55vw);
        height: min(440px, 55vw);
        top: 13%;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50%;
        background: #1d2aa0;
        opacity: 0.22;
        filter: blur(105px);
        z-index: -1;
      }

      .page::after {
        content: "";
        position: fixed;
        inset: -18px;
        background: url("./flowers-background.png") center / cover no-repeat;
        filter: blur(6px) brightness(0.32) saturate(0.78);
        opacity: 0.62;
        z-index: -2;
      }

      .topbar,
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: var(--accent-bright);
        font-size: clamp(0.82rem, 1.2vw, 1rem);
        letter-spacing: 0.01em;
      }

      .topbar span:last-child,
      .footer span:last-child {
        color: var(--text);
      }

      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 24px;
        padding: 48px 0 64px;
      }

      .hello-card {
        width: min(100%, 420px);
        min-height: 476px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 54px 48px 42px;
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: transparent;
        -webkit-backdrop-filter: blur(20px) saturate(135%);
        backdrop-filter: blur(20px) saturate(135%);
        text-align: center;
        box-shadow:
          0 0 0 1px rgba(189, 211, 255, 0.2),
          0 0 34px rgba(91, 137, 255, 0.48),
          0 -34px 105px rgba(93, 103, 255, 0.62),
          -32px -24px 66px rgba(121, 91, 255, 0.32),
          32px 28px 66px rgba(126, 207, 255, 0.28),
          0 34px 80px rgba(0, 0, 0, 0.48);
      }

      .hello-card::before {
        content: "";
        position: absolute;
        width: 180px;
        height: 110px;
        top: -34px;
        left: 50%;
        transform: translateX(-50%);
        background: #bcc6ff;
        border-radius: 50%;
        opacity: 0.68;
        filter: blur(35px);
      }

      .hello-card::after {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(219, 223, 255, 0.2);
        border-radius: 20px;
        box-shadow:
          -18px -12px 38px rgba(137, 104, 255, 0.48),
          18px 18px 38px rgba(255, 211, 157, 0.42);
        pointer-events: none;
      }

      .icon-wrap {
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
        margin-bottom: 22px;
        border: 1px solid rgba(223, 226, 255, 0.48);
        border-radius: 26px;
        background: var(--surface-soft);
        color: var(--accent-bright);
        font-size: 3rem;
        position: relative;
        top: -10px;
        box-shadow:
          0 0 18px rgba(129, 140, 255, 0.5),
          inset 0 0 24px rgba(113, 123, 255, 0.2);
        transform: rotate(-5deg);
        overflow: hidden;
        animation: icon-bounce 4.5s ease-in-out infinite;
      }

      @keyframes icon-bounce {
        0%,
        100% {
          transform: rotate(-5deg) translateY(0);
        }
        50% {
          transform: rotate(-5deg) translateY(-9px);
        }
      }

      .icon-wrap img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      .hello-card h1 {
        margin: 0 0 18px;
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(2.45rem, 6vw, 3.3rem);
        letter-spacing: -0.07em;
        color: #86efac;
      }

      .hello-card h1::after {
        content: "_";
        display: inline-block;
        margin-left: 6px;
        color: #bbf7d0;
        animation: cursor-blink 1s steps(1, end) infinite;
      }

      .card-divider {
        width: min(100%, 270px);
        height: 1px;
        margin: 0 0 18px;
        background: rgba(219, 223, 255, 0.34);
        box-shadow: 0 0 12px rgba(156, 167, 255, 0.3);
      }

      @keyframes cursor-blink {
        0%,
        48% {
          opacity: 1;
        }
        49%,
        100% {
          opacity: 0;
        }
      }

      .hello-card p {
        max-width: 340px;
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.65;
      }

      .code-card {
        width: min(100%, 420px);
        min-height: 0;
        padding: 14px 18px 16px;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(156, 167, 255, 0.42);
        border-radius: 16px;
        background: rgba(7, 10, 35, 0.24);
        -webkit-backdrop-filter: blur(18px) saturate(135%);
        backdrop-filter: blur(18px) saturate(135%);
        box-shadow:
          0 0 0 1px rgba(189, 211, 255, 0.12),
          0 0 30px rgba(91, 137, 255, 0.38),
          0 0 72px rgba(93, 103, 255, 0.28),
          0 18px 46px rgba(126, 207, 255, 0.2),
          inset 0 0 28px rgba(113, 123, 255, 0.08);
        text-align: left;
      }

      .code-card::after {
        content: "";
        position: absolute;
        inset: 8px;
        border: 1px solid rgba(219, 223, 255, 0.12);
        border-radius: 11px;
        pointer-events: none;
      }

      .code-card-header {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 15px;
        color: var(--muted);
        font-family: "JetBrains Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }

      .code-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #86efac;
        box-shadow: 0 0 10px rgba(134, 239, 172, 0.8);
      }

      .code-card pre {
        margin: 0;
        color: #b9c4ff;
        font: 600 0.84rem/1.7 "JetBrains Mono", monospace;
        white-space: pre-wrap;
      }

      .code-card .code-keyword {
        color: #c4b5fd;
      }

      .code-card .code-string {
        color: #86efac;
      }

      .explore-button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        border: 1px solid rgba(199, 205, 255, 0.56);
        border-radius: 7px;
        background: transparent;
        color: var(--text);
        font: inherit;
        font-size: 0.88rem;
        text-decoration: none;
        transition: 180ms ease;
      }

      .explore-button:hover,
      .explore-button:focus-visible {
        background: var(--accent-bright);
        color: var(--background);
        box-shadow:
          0 0 18px rgba(169, 178, 255, 0.72),
          0 0 42px rgba(117, 128, 255, 0.42);
        outline: none;
        transform: translateY(-4px) scale(1.04);
        animation: button-pulse 1s ease-in-out infinite alternate;
      }

      @keyframes button-pulse {
        from {
          box-shadow: 0 0 18px rgba(169, 178, 255, 0.62), 0 0 34px rgba(117, 128, 255, 0.32);
        }
        to {
          box-shadow: 0 0 28px rgba(220, 224, 255, 0.9), 0 0 58px rgba(117, 128, 255, 0.52);
        }
      }

      .favorite-button {
        padding: 8px;
        border: 0;
        background: transparent;
        color: var(--text);
        cursor: pointer;
        font-size: 1.35rem;
        transition: 180ms ease;
      }

      .favorite-button:hover,
      .favorite-button.is-liked {
        color: #ffb5df;
        transform: scale(1.12);
      }

      @media (max-width: 640px) {
        .page {
          padding: 32px 22px 28px;
        }

        .stage {
          gap: 20px;
          padding: 38px 0 52px;
        }

        .hello-card {
          min-height: 430px;
          padding: 44px 28px 34px;
        }

        .code-card {
          padding: 20px 18px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .icon-wrap,
        .hello-card h1::after,
        .explore-button {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="topbar" aria-label="Card header">
        <span>UI CARD DESIGN</span>
        <span>HELLO WORLD</span>
      </header>

      <section class="stage" aria-labelledby="hello-title">
        <article class="hello-card">
          <div class="icon-wrap" aria-hidden="true">
            <img src="./hello-world-icon.png" alt="Pixel-art Hello World mascot" />
          </div>
          <h1 id="hello-title">Hello World</h1>
          <div class="card-divider" aria-hidden="true"></div>
          <p>
            A first step into the web: a small creative experiment made with
            HTML and CSS while learning by building.
          </p>
          <a
            class="explore-button"
            href="https://aditya1809-08.github.io/Hello-World/"
            target="_blank"
            rel="noreferrer"
          >
            Explore it <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
          </a>
        </article>

        <article class="code-card" aria-label="Coding note">
          <div class="code-card-header">
            <span class="code-dot" aria-hidden="true"></span>
            <span>hello-world.js</span>
          </div>
          <pre><span class="code-keyword">const</span> message = <span class="code-string">"Keep building."</span>;
console.log(message);</pre>
        </article>
      </section>

      <footer class="footer">
        <button class="favorite-button" type="button" aria-label="Favorite this card" aria-pressed="false">
          <i class="fa-regular fa-heart" aria-hidden="true"></i>
        </button>
        <span>Light Leak Effect Card</span>
        <span>01</span>
      </footer>
    </main>

    <script>
      const favoriteButton = document.querySelector(".favorite-button");
      const heartIcon = favoriteButton.querySelector("i");

      favoriteButton.addEventListener("click", () => {
        const isLiked = favoriteButton.classList.toggle("is-liked");
        favoriteButton.setAttribute("aria-pressed", String(isLiked));
        heartIcon.className = isLiked
          ? "fa-solid fa-heart"
          : "fa-regular fa-heart";
      });
    </script>
  </body>
</html>
